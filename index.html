<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="description" content="Self motivated and passionate Senior Software Engineer with over 10 years of professional experience in software development through all phases, from requirement gathering and analysis to design, development, testing, and deployment. Highly knowledgeable in operating systems, development environments, data architecture, frontend and backend frameworks.">
    <meta name="author" content="Josh D. Riley">

    <title>Josh Riley | Software Engineer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8f9fa;
            color: #222;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: #fff;
            padding: 2rem 2.5rem;
            border-radius: 12px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.07);
            text-align: center;
        }
        h1 {
            margin-bottom: 0.5rem;
        }
        p {
            margin-bottom: 2rem;
            color: #555;
        }
        .actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        .actions a {
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            transition: background 0.2s;
        }
        .repos {
            background: #24292e;
            color: #fff;
        }
        .repos:hover {
            background: #444d56;
        }
        .website {
            background: #0078d4;
            color: #fff;
        }
        .website:hover {
            background: #005fa3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Josh Riley</h1>
        <p>Senior Software Engineer passionate about building robust and scalable solutions.</p>
        <div class="actions">
            <a class="repos" href="https://github.com/JRizzle88" target="_blank" rel="noopener">View Repositories</a>
            <a class="website" href="https://joshriley.website/" target="_blank" rel="noopener">View Website</a>
        </div>
    </div>
</body>
</html>
